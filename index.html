<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>For Your Dentist — Advanced 3D Dentistry & Premium Smile Design</title>
    <meta name="description" content="For Your Dentist offers next-gen dental care: implants, Invisalign, smile makeovers, cosmetic dentistry, root canals & teeth whitening. Book your appointment today." />
    <meta name="keywords" content="dental clinic, dentist, implants, Invisalign, teeth whitening, cosmetic dentistry, smile makeover, root canal, dental appointment" />
    <meta name="author" content="For Your Dentist" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="For Your Dentist — Advanced 3D Dentistry" />
    <meta property="og:description" content="Next-gen dental care powered by advanced technology, gentle care, and a seamless patient experience. Book your appointment today." />
    <meta property="og:site_name" content="For Your Dentist" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="For Your Dentist — Advanced 3D Dentistry" />
    <meta name="twitter:description" content="Premium futuristic dental clinic with an advanced digital reservation system." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="msapplication-TileColor" content="#7c3aed" />

    <!-- JSON-LD Structured Data for Dental Clinic -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Dentist",
      "name": "For Your Dentist",
      "description": "Premium futuristic dental clinic with advanced 3D dentistry and digital reservation system.",
      "url": "https://zenova-dental-1.onrender.com",
      "telephone": "+91-9608106681",
      "priceRange": "$$",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "08:00",
          "closes": "19:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "09:00",
          "closes": "14:00"
        }
      ],
      "medicalSpecialty": [
        "Dental Implants",
        "Cosmetic Dentistry",
        "Orthodontics",
        "Endodontics",
        "Teeth Whitening"
      ]
    }
    </script>

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
